<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>螺絲 CAD 生成器 - 系統測試 v3</title>
<style>
  body { margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; display: flex; height: 100vh; background: #f4f5f7; }
  #side { width: 300px; padding: 18px; box-sizing: border-box; background: #fff; border-right: 1px solid #ddd; overflow: auto; }
  #view { flex: 1; position: relative; }
  button { width: 100%; padding: 10px; margin: 6px 0; font-size: 15px; cursor: pointer; }
  button:disabled { cursor: wait; opacity: .5; }
  #status { font-size: 13px; color: #333; white-space: pre-wrap; margin-top: 10px; word-break: break-all; }
  #status.err { color: #b00020; }
  #info { font-size: 11px; color: #888; white-space: pre-wrap; margin-top: 16px; word-break: break-all; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="side">
  <h3>系統可行性測試 v3</h3>
  <p>M3 x 0.5 x 10 盤頭十字 PH1<br>（真實螺旋螺紋）</p>
  <button id="gen" disabled>1. 產生模型 + 3D 預覽</button>
  <button id="save" disabled>2. 另存 STEP</button>
  <div id="status">介面載入中…</div>
  <div id="info"></div>
</div>
<div id="view"></div>
<script>
  // catch anything that goes wrong, even before the module below loads
  function showErr(msg) { const s = document.getElementById("status"); s.className = "err"; s.textContent = "錯誤：\n" + msg;
    try { window.pywebview && window.pywebview.api.js_log("ERROR " + msg); } catch (e) {} }
  window.addEventListener("error", e => showErr(e.message + (e.filename ? "\n" + e.filename + ":" + e.lineno : "")));
  window.addEventListener("unhandledrejection", e => showErr(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/OrbitControls.js";

const $ = id => document.getElementById(id);
const status = $("status"), info = $("info"), genBtn = $("gen"), saveBtn = $("save");
const setStatus = (t, err = false) => { status.className = err ? "err" : ""; status.textContent = t; };

// ---------- 3D view
const view = $("view");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) { showErr("3D 繪圖 (WebGL) 無法啟動：" + e.message); throw e; }
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xeef0f3);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000); camera.up.set(0, 0, 1); camera.position.set(25, -25, 15);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 1.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(20, -30, 40); scene.add(dl);
let mesh = null;
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener("resize", resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

function b64ToBuffer(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }

// ---------- wait for the Python side + CAD kernel
// pywebview creates window.pywebview.api first and fills in the functions a moment later,
// so wait until the functions themselves exist (not just the api object).
async function waitApi() {
  const t = performance.now();
  while (!(window.pywebview && window.pywebview.api && typeof window.pywebview.api.status === "function"
           && typeof window.pywebview.api.generate === "function")) {
    if (performance.now() - t > 60000) throw new Error("與 Python 端連線逾時（60 秒）");
    await new Promise(r => setTimeout(r, 100));
  }
}
setStatus("連線 Python 端…");
await waitApi();
const t0 = performance.now();
setStatus("載入 CAD 幾何核心中…（第一次開啟較久）");
for (;;) {
  const st = await window.pywebview.api.status();
  info.textContent = `版本 ${st.version}\n${st.os}\n記錄檔：${st.log}`;
  if (st.error) { setStatus("CAD 核心載入失敗：\n" + st.error, true); break; }
  if (st.ready) { setStatus(`就緒（核心載入 ${st.seconds.toFixed(1)} 秒）`); genBtn.disabled = false; break; }
  setStatus(`載入 CAD 幾何核心中… ${((performance.now() - t0) / 1000).toFixed(0)} 秒`);
  await new Promise(r => setTimeout(r, 1000));
}

genBtn.onclick = async () => {
  genBtn.disabled = true;
  const t = performance.now();
  const timer = setInterval(() => setStatus(`計算中… ${((performance.now() - t) / 1000).toFixed(0)} 秒`), 500);
  try {
    const r = await window.pywebview.api.generate();
    const tRecv = (performance.now() - t) / 1000;
    clearInterval(timer);
    if (!r.ok) { setStatus("錯誤：\n" + r.error, true); return; }
    if (mesh) scene.remove(mesh);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(b64ToBuffer(r.verts)), 3));
    g.setIndex(new THREE.BufferAttribute(new Uint32Array(b64ToBuffer(r.tris)), 1));
    g.computeVertexNormals();
    mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xb8bcc4, metalness: 0.6, roughness: 0.35 }));
    scene.add(mesh);
    g.computeBoundingSphere(); const c = g.boundingSphere.center; controls.target.copy(c);
    camera.position.set(c.x + 18, c.y - 18, c.z + 10);
    const total = (performance.now() - t) / 1000;
    const msg = `完成：${r.ntri.toLocaleString()} 三角面\n體積 ${r.volume.toFixed(2)} mm³\n` +
      `建模 ${r.build_s.toFixed(1)} 秒 / 網格 ${r.mesh_s.toFixed(1)} 秒\n傳輸 ${(tRecv - r.build_s - r.mesh_s).toFixed(1)} 秒 / 總計 ${total.toFixed(1)} 秒`;
    setStatus(msg);
    window.pywebview.api.js_log(msg.replace(/\n/g, " | "));
    saveBtn.disabled = false;
  } catch (e) {
    clearInterval(timer);
    showErr(e.stack || e.message || String(e));
  } finally { genBtn.disabled = false; }
};
saveBtn.onclick = async () => {
  try {
    const r = await window.pywebview.api.save_step();
    setStatus(r.ok ? "已儲存：\n" + r.path : r.error, !r.ok && r.error !== "已取消");
  } catch (e) { showErr(e.stack || e.message || String(e)); }
};
</script>
</body>
</html>

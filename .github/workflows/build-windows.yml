name: Build ScrewGen (manual)

# 只在手動按下時打包：Actions > Build ScrewGen (manual) > Run workflow > 選擇平台
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "打包平台"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - mac

env:
  PYI_COLLECT: >-
    --collect-all cadquery --collect-all OCP --collect-all vtkmodules
    --collect-all casadi --collect-all nlopt --collect-all webview

jobs:
  windows:
    if: ${{ inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Self-test in plain Python
        run: python app.py --selftest --out st_py; Get-Content st_py\selftest.log
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --onedir --windowed --name ScrewGen --add-data "web:web" ${{ env.PYI_COLLECT }} app.py
      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ScrewGen\ScrewGen.exe" -ArgumentList "--selftest","--out","$env:RUNNER_TEMP\st" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\st\selftest.log"
          if ($p.ExitCode -ne 0) { throw "packaged selftest failed (exit $($p.ExitCode))" }
          Remove-Item dist\ScrewGen\screwgen.log -ErrorAction SilentlyContinue
          Copy-Item "dist_docs\README_Windows.txt" dist\ScrewGen\
          $size = (Get-ChildItem dist\ScrewGen -Recurse | Measure-Object Length -Sum).Sum / 1MB
          "Package size: {0:N0} MB" -f $size
      - uses: actions/upload-artifact@v6
        with:
          name: ScrewGen-windows
          path: dist/   # zip 內為 ScrewGen/ 資料夾

  mac:
    if: ${{ inputs.platform == 'mac' }}
    runs-on: macos-15   # Apple Silicon (arm64)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Self-test in plain Python
        run: python app.py --selftest --out st_py && cat st_py/selftest.log
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --onedir --windowed --name ScrewGen --osx-bundle-identifier tw.ll.screwgen --add-data "web:web" ${{ env.PYI_COLLECT }} app.py
      - name: Self-test the packaged app
        run: |
          dist/ScrewGen.app/Contents/MacOS/ScrewGen --selftest --out "$RUNNER_TEMP/st"; rc=$?
          cat "$RUNNER_TEMP/st/selftest.log"
          test $rc -eq 0
          du -sh dist/ScrewGen.app
      - name: Zip app (ditto keeps permissions and signatures)
        run: |
          mkdir out
          ditto -c -k --keepParent dist/ScrewGen.app out/ScrewGen-mac-arm64.zip
          cp "dist_docs/README_Mac.txt" out/
      - uses: actions/upload-artifact@v6
        with:
          name: ScrewGen-mac-arm64
          path: out/
